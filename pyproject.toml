[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wyomingchat"
version = "0.1.0"
description = "Wayland-native desktop bridge for local Wyoming STT and TTS services"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Wyoming Voice Bridge Contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "PySide6>=6.10.0",
  "dbus-next>=0.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
wyoming-voice-bridge = "wyomingchat.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wyomingchat"]
shared-data = { "resources/io.github.justinlime.WyomingVoiceBridge.desktop" = "share/applications/io.github.justinlime.WyomingVoiceBridge.desktop" }

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/resources/io.github.justinlime.WyomingVoiceBridge.desktop",
  "/src/wyomingchat",
  "/tests",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]
